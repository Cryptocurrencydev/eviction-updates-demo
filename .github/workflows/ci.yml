name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dl_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dl_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Prepare e2e database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database dl_e2e'
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          APP_URL: http://localhost:3200
      - run: npm run build
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          APP_URL: http://localhost:3200
          PLAYWRIGHT_LOCAL: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
